name: Desktop Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop installer to build (unsigned)
        type: choice
        default: windows
        options:
          - windows
          - linux
          - macos-arm64
          - macos-x64
          - all

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Select build targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      version: ${{ steps.targets.outputs.version }}
      windows: ${{ steps.targets.outputs.windows }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: apps/desktop/package.json
          sparse-checkout-cone-mode: false

      - name: Select build targets
        id: targets
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const targets = [
              { id: 'windows', runner: 'windows-2025', platform: 'win', arch: 'x64', target: 'nsis' },
              { id: 'linux', runner: 'ubuntu-24.04', platform: 'linux', arch: 'x64', target: 'AppImage' },
              { id: 'macos-arm64', runner: 'macos-15', platform: 'mac', arch: 'arm64', target: 'dmg' },
              { id: 'macos-x64', runner: 'macos-15-intel', platform: 'mac', arch: 'x64', target: 'dmg' },
            ];
            const selected = targets.filter(({ id }) => process.env.BUILD_PLATFORM === 'all' || id === process.env.BUILD_PLATFORM);
            if (selected.length === 0) throw new Error('Select a supported desktop platform.');
            const { version } = JSON.parse(readFileSync('apps/desktop/package.json', 'utf8'));
            core.setOutput('matrix', JSON.stringify({ include: selected }));
            core.setOutput('version', `${version}-pr.${context.runNumber}`);
            core.setOutput('windows', String(selected.some(({ platform }) => platform === 'win')));

  wsl_runtime:
    name: Build Linux runtime for Windows WSL
    needs: prepare
    if: needs.prepare.outputs.windows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      VP_REMOTE_CACHE: "off"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+ and Node
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Set version and public connection configuration
        run: |
          node scripts/update-release-package-versions.ts "$APP_VERSION"
          cp .env.example .env

      - name: Build server and executable
        run: |
          vp run --filter t3 build
          vp run --filter t3 build:exe

      - name: Build resource monitor
        run: |
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p apps/server/dist/resource-monitor/linux-x64
          cp native/resource-monitor/target/release/t3-resource-monitor apps/server/dist/resource-monitor/linux-x64/

      - name: Package Linux CLI archive
        run: node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$APP_VERSION" --output-dir release-cli

      - name: Smoke-test Linux CLI archive
        run: node scripts/smoke-cli-archive.ts --archive release-cli/*.tar.gz --expect-version "$APP_VERSION"

      - name: Upload WSL runtime
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-build-wsl-runtime
          path: release-cli/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build ${{ matrix.id }}
    needs: [prepare, wsl_runtime]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && (needs.wsl_runtime.result == 'success' || needs.wsl_runtime.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      VP_REMOTE_CACHE: "off"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      T3CODE_DESKTOP_SIGNED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libsecret-1-dev pkg-config imagemagick libfuse2t64 libwayland-dev libxkbcommon-dev libdbus-1-dev

      - name: Setup Vite+ and Node
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Set version and public connection configuration
        run: |
          node scripts/update-release-package-versions.ts "$APP_VERSION"
          cp .env.example .env

      - name: Ensure Electron runtime
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Download Windows WSL runtime
        if: matrix.platform == 'win'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-build-wsl-runtime
          path: wsl-runtime

      - name: Build unsigned installer
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          args=(--platform "$BUILD_PLATFORM" --target "$BUILD_TARGET" --arch "$BUILD_ARCH" --build-version "$APP_VERSION" --output-dir release --verbose)
          if [[ "$BUILD_PLATFORM" == "win" ]]; then
            args+=(--wsl-runtime "$GITHUB_WORKSPACE/wsl-runtime/t3-${APP_VERSION}-linux-x64.tar.gz")
          fi
          vp run dist:desktop:artifact "${args[@]}"

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3code-${{ matrix.id }}-${{ needs.prepare.outputs.version }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
          if-no-files-found: error
          retention-days: 14
