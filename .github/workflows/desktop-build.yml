name: Desktop Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Windows installer or Android app to build (unsigned)
        type: choice
        default: windows
        options:
          - windows
          - android
          - all

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Select build targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      version: ${{ steps.targets.outputs.version }}
      desktop: ${{ steps.targets.outputs.desktop }}
      android: ${{ steps.targets.outputs.android }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: apps/desktop/package.json
          sparse-checkout-cone-mode: false

      - name: Select build targets
        id: targets
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          BUILD_PLATFORM: ${{ github.event_name == 'push' && 'all' || inputs.platform }}
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const targets = [
              { id: 'windows', runner: 'windows-2025', platform: 'win', arch: 'x64', target: 'nsis' },
            ];
            const platform = process.env.BUILD_PLATFORM;
            const selected = targets.filter(({ id }) => platform === 'all' || id === platform);
            if (selected.length === 0 && platform !== 'android') throw new Error('Select a supported platform.');
            const { version } = JSON.parse(readFileSync('apps/desktop/package.json', 'utf8'));
            core.setOutput('matrix', JSON.stringify({ include: selected }));
            core.setOutput('version', `${version}-build.${context.runNumber}`);
            core.setOutput('desktop', String(selected.length > 0));
            core.setOutput('android', String(platform === 'all' || platform === 'android'));

  build:
    name: Build ${{ matrix.id }}
    needs: prepare
    if: needs.prepare.outputs.desktop == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}
      VP_REMOTE_CACHE: "off"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      T3CODE_DESKTOP_SIGNED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+ and Node
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/web... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Set version and public connection configuration
        run: |
          node scripts/update-release-package-versions.ts "$APP_VERSION"
          cp .env.example .env

      - name: Ensure Electron runtime
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Build unsigned installer
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: vp run dist:desktop:artifact --platform "$BUILD_PLATFORM" --target "$BUILD_TARGET" --arch "$BUILD_ARCH" --build-version "$APP_VERSION" --output-dir release --verbose

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3code-${{ matrix.id }}-${{ needs.prepare.outputs.version }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build android
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VP_REMOTE_CACHE: "off"
      APP_VARIANT: development
      EXPO_NO_GIT_STATUS: "1"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+ and Node
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set public connection configuration
        run: cp .env.example .env

      - name: Generate native Android project
        working-directory: apps/mobile
        run: vp exec expo prebuild --clean --platform android --no-install

      - name: Build Android APK
        working-directory: apps/mobile/android
        run: ./gradlew app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3code-android-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
